[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "orchatlas"
version = "0.2.0"
description = "Coordinated Codex and OpenCode workflows with versioned team recipes"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE"]
authors = [{name = "OrchAtlas contributors"}]
dependencies = ["prompt-toolkit>=3.0.48,<4", "rich>=13.9,<15"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Programming Language :: Python :: 3",
  "Environment :: Console",
]

[project.scripts]
orchatlas = "orchatlas.cli:main"

[project.urls]
Repository = "https://github.com/HunterStile/orchatlas"
Issues = "https://github.com/HunterStile/orchatlas/issues"
Documentation = "https://github.com/HunterStile/orchatlas#readme"

[tool.setuptools.packages.find]
include = ["orchatlas*"]

[tool.setuptools.package-data]
orchatlas = ["data/*.json", "templates/*.md"]
